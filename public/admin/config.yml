backend:
  name: github
  repo: hexdesignlabs/hexdesignlabs-site
  branch: main
  # Cloudflare Pages does not provide Netlify's built-in GitHub OAuth proxy.
  # These settings point Decap at this site's Cloudflare Pages Functions:
  #   /api/auth     -> redirects editors to GitHub OAuth
  #   /api/callback -> exchanges the OAuth code for a token and returns it to Decap
  #
  # Production setup:
  # 1. Create a GitHub OAuth App.
  # 2. Set Homepage URL to https://hexdesignlabs.com.
  # 3. Set Authorization callback URL to https://hexdesignlabs.com.
  #    GitHub accepts /api/callback as a subpath of this callback URL.
  # 4. Add GITHUB_CLIENT_ID and GITHUB_CLIENT_SECRET as encrypted runtime
  #    secrets in Cloudflare Pages > Settings > Variables and Secrets for the
  #    Production environment, then redeploy. Build-only/public variables are not
  #    enough; the Pages Function must see them on context.env at runtime.
  site_domain: https://hexdesignlabs.com
  base_url: https://hexdesignlabs.com
  auth_endpoint: /api/auth

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: blog
    label: Blog
    folder: src/content/blog
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text }
      - { label: Publish Date, name: pubDate, widget: datetime }
      - { label: Updated Date, name: updatedDate, widget: datetime, required: false }
      - { label: Author, name: author, widget: string, default: HEX Design Labs }
      - { label: Featured Image, name: image, widget: image }
      - { label: Featured Image Alt Text, name: imageAlt, widget: string }
      - { label: Tags, name: tags, widget: list, required: false }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - { label: Body, name: body, widget: markdown }
