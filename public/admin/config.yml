backend:
  name: github
  repo: hexdesignlabs/hexdesignlabs-site
  branch: development
  # Cloudflare Pages does not provide Netlify's built-in GitHub OAuth proxy.
  # These settings point Decap at this site's Cloudflare Pages Functions:
  #   /api/auth     -> redirects editors to GitHub OAuth
  #   /api/callback -> exchanges the OAuth code for a token and returns it to Decap
  #
  # Development preview testing setup:
  # 1. Create a GitHub OAuth App.
  # 2. Set Homepage URL to https://development.hexdesignlabs-site.pages.dev.
  # 3. Set Authorization callback URL to https://development.hexdesignlabs-site.pages.dev.
  #    GitHub accepts /api/callback as a subpath of this callback URL.
  # 4. Add GITHUB_CLIENT_ID and GITHUB_CLIENT_SECRET to the Cloudflare Pages
  #    project environment variables for Preview.
  site_domain: https://development.hexdesignlabs-site.pages.dev
  base_url: https://development.hexdesignlabs-site.pages.dev
  auth_endpoint: /api/auth

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: blog
    label: Blog
    folder: src/content/blog
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text }
      - { label: Publish Date, name: pubDate, widget: datetime }
      - { label: Updated Date, name: updatedDate, widget: datetime, required: false }
      - { label: Author, name: author, widget: string, default: HEX Design Labs }
      - { label: Featured Image, name: image, widget: image }
      - { label: Featured Image Alt Text, name: imageAlt, widget: string }
      - { label: Tags, name: tags, widget: list, required: false }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - { label: Body, name: body, widget: markdown }
